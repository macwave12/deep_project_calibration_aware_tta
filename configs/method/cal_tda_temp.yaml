# Headline method "cal_tda_temp": leave-one-out temperature only.
# Margin admission is off: the cache is filled by upstream TDA's own rule.
# Same settings as configs/method/ablation_gate/temp.yaml; this copy is the one
# scripts/run_all.ps1 runs so results/summary.csv carries it under this name.
use_margin_admission: false
margin_threshold: 1.0
use_prob_fusion: false
fusion_weight: 0.5
fusion_gate: false
fusion_gate_max_gap: 0.2
fusion_gate_min_mass: 0.6
fusion_sharpen_cache: false
use_loo_temperature: true

entropy_threshold: 0.5
alpha: 2.0
beta: 5.0
shot_capacity: 3
