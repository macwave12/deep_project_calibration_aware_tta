# T14 candidate + contribution 3: agreement-gated cache with the label-free LOO temperature. TDA (every other contribution off) with the
# positive cache used only where its argmax differs from CLIP's pseudo-label.
use_margin_admission: false
margin_threshold: 0.1
use_prob_fusion: false
fusion_weight: 0.5
use_loo_temperature: true
agreement_gate: true
agreement_temperature: 1.0
entropy_threshold: 0.5
alpha: 2.0
beta: 5.0
shot_capacity: 3
