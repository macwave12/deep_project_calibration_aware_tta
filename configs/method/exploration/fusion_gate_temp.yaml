# Exploration variant "fusion_gate_temp": gated probabilistic fusion (fuse only
# on two-way ties, plain CLIP elsewhere) plus leave-one-out temperature scaling.
# Margin admission off: the cache is filled by upstream TDA's own rule.
# Not part of the ablation; records land in results/raw/exploration/.
use_margin_admission: false
margin_threshold: 1.0
use_prob_fusion: true
fusion_weight: 0.5
fusion_gate: true
fusion_gate_max_gap: 0.2
fusion_gate_min_mass: 0.6
fusion_sharpen_cache: false
use_loo_temperature: true

entropy_threshold: 0.5
alpha: 2.0
beta: 5.0
shot_capacity: 3
