# Ablation variant "all": all three contributions on — identical to our full
# method, configs/method/cal_tda.yaml. Kept as a separate file (rather than
# reusing cal_tda.yaml directly) so every ablation record comes from the same
# ablation/ directory and --run-name convention.
use_margin_admission: true
margin_threshold: 1.0
use_prob_fusion: true
fusion_weight: 0.5
use_loo_temperature: true

entropy_threshold: 0.5
alpha: 2.0
beta: 5.0
shot_capacity: 3
