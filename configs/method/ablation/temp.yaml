# Ablation variant "temp": only leave-one-out temperature scaling on.
# Base: configs/method/cal_tda.yaml — margin_threshold, fusion_weight,
# entropy_threshold, alpha, beta, shot_capacity all inherited unchanged.
# margin_threshold is inert here (use_margin_admission is off) but kept at
# 1.0 rather than re-typed, per CalTdaConfig.inert_fields().
use_margin_admission: false
margin_threshold: 1.0
use_prob_fusion: false
fusion_weight: 0.5
use_loo_temperature: true

entropy_threshold: 0.5
alpha: 2.0
beta: 5.0
shot_capacity: 3
